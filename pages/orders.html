<!-- ORDERS HISTORY -->
<div class="section-header">
  <h2>My Orders</h2>
  <p style="color:var(--muted);font-size:14px">View and track your order history</p>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="orders-table">
      <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px">No orders yet</td></tr>
    </tbody>
  </table>
  <div class="empty" id="orders-empty" style="display:none;text-align:center;padding:40px">
    <div style="font-size:48px;margin-bottom:12px">📋</div>
    <p style="color:var(--muted)">No orders yet</p>
  </div>
</div>
